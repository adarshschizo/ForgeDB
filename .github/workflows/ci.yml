name: ForgeDB CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Test
        run: go test ./...
      - name: Race
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Coverage
        run: go test -coverprofile=coverage.out ./...
      - name: Docker build
        run: docker build -t forgedb:ci .
